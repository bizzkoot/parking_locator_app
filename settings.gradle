pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "parking_locator_app"
include ':app'

gradle.taskGraph.whenReady {
    gradle.taskGraph.allTasks.each { task ->
        if (task.name.contains("testClasses")) {
            task.enabled = false
        }
    }
}